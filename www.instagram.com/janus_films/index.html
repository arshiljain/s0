baret art-pop balladeer, his soaring vibrato resonating throughout a theater known for its legendary acoustics. Oscar-winning filmmaker Paul Thomas Anderson was there with a crew, including his LICORICE PIZZA collaborator Benny Safdie, to capture this major star-is-born moment, and the result is a smashing cinematic concert, shot on 16mm and 35mm with a perfect mix of intimate images of Winter and of the cavernous space, keyed into the singer-songwriter\u2019s effortless combination of bravado and sensitivity, darkness and light.\n\nPhoto by Lewis Evans.\n\n#cameronwinter #paulthomasanderson #cameronwinteratcarnegiehall"},"seo_canonical_url":null,"display_uri":"https:\/\/scontent.cdninstagram.com\/v\/t51.82787-15\/814637193_18484597903108553_3622411230478219317_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=104&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=5CwA4xqzq-YQ7kNvwF2C6km&_nc_oc=AdpB2YEQ71YpT7XrtANMREd9sxATsGoGgbJhuI7OPnuiGNH0LuOlbh3HkUi1v6uVAVKyWKeOr1F8H_e2QWKNRRQg&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=aKSO2Q8d4R4MGOHcjZNmlQ&_nc_ss=78689&oh=00_AQIGjYdQgcOkYyaZWbmM9VARl0I0Y0_R78FDk0dL9QqTsw&oe=6AB8996D","media_type":1,"product_type":"feed","user":{"pk":"3316340552","username":"thenyff","id":"17841403256584542"},"id":"POLARIS_3988313863591303657"},"cursor":"AQHTj47X1IQBeMBgQR-QR_RQ4hycs9xnRBitluydh8N_rfaylfDNfXtXLU9rIRCbJTiinv568CIpNh6Ulq69y3uGGQ"},{"node":{"__typename":"XIGPolarisImageMedia","__isXIGPolarisMedia":"XIGPolarisImageMedia","pk":"3988286442380034508","code":"DdZPWN0kYHM","accessibility_caption":"Photo by Janus Films on September 17, 2026. May be an image of poster, crowd and text that says 'CAMERON WINTER AT CARNEGIE HALL PAUL THOMAS ANDERSON TICKETS ON SALE NOW 35MM TOUR TX Mo KY IL TX NE Mo AZ FL NY NY CA CA MD CA ON IL GA X TX MA co CA TN BC WI WA MI OR WI PA CA NY NC'.","caption":{"text":"Tickets for the 35mm tour of Paul Thomas Anderson's CAMERON WINTER AT CARNEGIE HALL are now on sale! \n\n
