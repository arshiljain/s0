      /* Regular */
      @font-face {
        font-display: swap;
        font-family: 'Handset Sans UI';
        src: url('https://auth.hbomax.com/fonts/HandsetSansUI-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }

      /* Bold */
      @font-face {
        font-display: swap;
        font-family: 'Handset Sans UI';
        src: url('https://auth.hbomax.com/fonts/HandsetSansUI-Bold.woff2') format('woff2');

        font-style: normal;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
      }
      body {
        background-color: #000000;
        background-image: url('https://auth.hbomax.com/background-utility.jpg');
        color: #ffffff;
        padding: 0px 20px 0px 20px;
      }

      div {
        position: relative;
        margin: 0 auto;
        width: 470px;
        max-width: 100%;
      }

      div.logo {
        height: 80px;
        margin: 0px 0px 24px 0px;
        width: 100%;
      }

      div.logo img {
        display: block;
        height: 22px;
        margin: 0 auto;
        padding: 29px 0px 29px 0px;
        width: auto;
      }

      h1 {
        font-family: 'Handset Sans UI', Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 18px;
        line-height: 24px;
        margin: 0px 0px 16px 0px;
        text-align: center;
      }

      p {
        font-family: 'Handset Sans UI', Arial, Helvetica, sans-serif;
        font-weight: 400;
        font-size: 14px;
        line-height: 21px;
        margin: 0px 0px 16px 0px;
        text-align: center;
      }

      a {
        color: #71b8f2;
        font-weight: 500;
        text-decoration: none;
      }

      a:visited {
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media only screen and (max-width: 440px) {
        div.logo img {
          height: 16px;
          padding: 32px 0px 32px 0px;
        }
        h1 {
          margin: 0px 0px 16px 0px;
        }
        p {
          margin: 0px 0px 16px 0px;
        }
      }

      @media only screen and (min-width: 1100px) {
        h1 {
          font-size: 28px;
          line-height: 38px;
        }
        p {
          font-size: 16px;
          line-height: 24px;
        }
      }
    </style>
